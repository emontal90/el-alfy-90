name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK for Release
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/el-Alfy-App.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: el-Alfy-Android-APK
          path: build/app/outputs/flutter-apk/el-Alfy-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "نسخة التطبيق v1.0.0"
          body: |
            ## تطبيق الأثاث وإدارة المعرض (El-Alfy ERP) 📱
            - تم البناء والتحزيم تلقائياً عبر GitHub Actions.
            - اضغط على الرابط بالأسفل لتحميل ملف الـ APK وتثبيته مباشرة على الهاتف.
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/el-Alfy-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
