name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get App Version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK Files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/el-Alfy-App.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/el-Alfy-v${{ steps.version.outputs.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: el-Alfy-Android-APK-v${{ steps.version.outputs.APP_VERSION }}
          path: build/app/outputs/flutter-apk/el-Alfy-v${{ steps.version.outputs.APP_VERSION }}.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version.outputs.APP_VERSION }}
          name: "إصدار التطبيق v${{ steps.version.outputs.APP_VERSION }}"
          body: |
            ## تطبيق الألفي لإدارة المعرض والمخازن (El-Alfy ERP) - v${{ steps.version.outputs.APP_VERSION }}
            - تم البناء والتحزيم تلقائياً عبر GitHub Actions.
            - اضغط على الملف أدناه لتحميل التطبيق وتثبيته مباشرة على الهاتف.
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/el-Alfy-App.apk
            build/app/outputs/flutter-apk/el-Alfy-v${{ steps.version.outputs.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
