name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get App Version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing Android signing secrets! Please add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/el-alfy-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$CLEAN_STORE_PASS" -alias "$CLEAN_ALIAS" >/dev/null 2>&1; then
            echo "::error::Failed to verify keystore with KEYSTORE_PASSWORD and KEY_ALIAS. Check GitHub Secrets formatting."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=$CLEAN_STORE_PASS
          keyPassword=$CLEAN_KEY_PASS
          keyAlias=$CLEAN_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF
          chmod 600 android/key.properties

      - name: Build Release APK
        run: flutter build apk --release

      - name: Clean Signing Secrets
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/el-alfy-release.jks"

      - name: Prepare APK Files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/el-Alfy-App.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/el-Alfy-v${{ steps.version.outputs.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: el-Alfy-Android-APK-v${{ steps.version.outputs.APP_VERSION }}
          path: build/app/outputs/flutter-apk/el-Alfy-v${{ steps.version.outputs.APP_VERSION }}.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version.outputs.APP_VERSION }}
          name: "إصدار التطبيق v${{ steps.version.outputs.APP_VERSION }}"
          body: |
            ## تطبيق الألفي لإدارة المعرض والمخازن (El-Alfy ERP) - v${{ steps.version.outputs.APP_VERSION }}
            - تم البناء والتحزيم تلقائياً عبر GitHub Actions.
            - اضغط على الملف أدناه لتحميل التطبيق وتثبيته مباشرة على الهاتف.
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/el-Alfy-App.apk
            build/app/outputs/flutter-apk/el-Alfy-v${{ steps.version.outputs.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
